name: permission_app
description: Permission Manager App controlled by Admin Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # Permissions
  permission_handler: ^11.3.0

  # File & Image Browser
  file_manager: ^1.0.0
  photo_view: ^0.14.0
  image_picker: ^1.0.7
  open_file: ^3.3.2
  path_provider: ^2.1.2
  mime: ^1.0.5
  path: ^1.9.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
